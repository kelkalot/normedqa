  sami-se-blodprov-psa-html-p00-q1:
    question: PSA-dieđuid mielde, goas sáhttá olmmoš bivdojuvvot váldit PSA-iskosa, jos sus leat gožžaráhkováivvit?
    options:
      B: Go doavttir jáhkká ahte váivvit sáhttet boahtit prostátas
    reason: 'Reviewer feedback 2026-11-16: the draft asked about guođđit (leaving, skipping) a PSA test, copied from the passage''s word-for-word rendering
      of Swedish ''lämna ett PSA-prov'' (give a sample); option B said the doctor doubts (eahpida) where the key says the doctor believes.'
