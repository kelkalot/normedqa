- id: se-iskkus-for-undersokelse
  language: se
  note: The noun for a clinical examination is iskkus, not dutkamuš (study). Confirmed by the reviewer 2026-11-20. Forms follow the iskkus paradigm (iskkus,
    iskosa, iskosat, iskosiid, ...); compounds keep their first part.
  pattern: dutkamuš\w*
  map:
    dutkamuš: iskkus
    dutkamuša: iskosa
    dutkamušat: iskosat
    dutkamušaid: iskosiid
    dutkamušain: iskosiin
    dutkamušii: iskosii
    dutkamušas: iskosis
    dutkamušaide: iskosiidda
  items: *id001
